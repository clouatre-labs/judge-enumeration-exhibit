name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".commitlintrc.yml"
      - ".zenodo.json"
      - "CITATION.cff"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "experiments/**"
      - "recipe/**"
      - "validate_schema.py"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-commits:
    name: Lint Commits
    permissions:
      contents: read
    uses: clouatre-labs/.github/.github/workflows/lint-commits.yml@c546e09adb87caef81ae109cb3c27d016bea0fae # reusable lint-commits
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}

  schema-check:
    name: Schema Check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate experiment schemas
        run: |
          uv run python validate_schema.py --self-test
          uv run python validate_schema.py

  # Aggregate status check: add language-specific jobs (lint, test, build)
  # to the needs array as the repo grows; the ruleset keeps requiring only
  # this one check.
  ci-result:
    name: CI Result
    runs-on: ubuntu-26.04-arm
    needs: [lint-commits, schema-check]
    if: always()
    permissions: {}
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."